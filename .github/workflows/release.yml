name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases so two pushes can't compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify secrets
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=""
          [ -z "$P12" ] && missing="$missing APPLE_DEVELOPER_CERTIFICATE_P12_BASE64"
          [ -z "$P12_PASSWORD" ] && missing="$missing APPLE_DEVELOPER_CERTIFICATE_PASSWORD"
          [ -z "$APPLE_ID" ] && missing="$missing APPLE_ID"
          [ -z "$APP_SPECIFIC" ] && missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing — see README for setup."
            exit 1
          fi
          echo "all required secrets present"

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          last=$(git tag --list 'v[0-9]*' | sort -V | tail -n 1 || true)
          if [ -z "$last" ]; then
            version="0.1.0"
          else
            version=$(echo "$last" | sed 's/^v//' | awk -F. '{print $1"."$2"."$3+1}')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next version: v$version (last tag: ${last:-none})"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Import signing certificate
        env:
          P12_B64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          INSTALLER_P12_B64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/app-cert.p12"
          security import "$RUNNER_TEMP/app-cert.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/app-cert.p12"
          if [ -n "$INSTALLER_P12_B64" ]; then
            echo "$INSTALLER_P12_B64" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"
            security import "$RUNNER_TEMP/installer-cert.p12" \
              -P "${INSTALLER_P12_PASSWORD:-$P12_PASSWORD}" \
              -A -t cert -f pkcs12 -k "$keychain"
            rm "$RUNNER_TEMP/installer-cert.p12"
            echo "installer certificate imported"
          else
            echo "no installer certificate — PKG will be unsigned"
          fi
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          app_identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep 'Developer ID Application:.*(LW385M78LW)' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          [ -n "$app_identity" ] || { echo "::error::no Developer ID Application identity found"; exit 1; }
          echo "APP_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "app identity: $app_identity"
          installer_identity=$(security find-identity -v "$keychain" \
            | grep 'Developer ID Installer:.*(LW385M78LW)' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -n "$INSTALLER_P12_B64" ] && [ -z "$installer_identity" ]; then
            echo "::error::Installer P12 has no valid Developer ID Installer identity for LW385M78LW"
            exit 1
          fi
          echo "INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
          echo "installer identity: ${installer_identity:-none}"

      - name: Build
        run: |
          set -euo pipefail
          swift build -c release --arch arm64

      - name: Assemble and sign app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app="dist/AIQuota.app"
          rm -rf dist
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp .build/release/AIQuota "$app/Contents/MacOS/AIQuota"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$app/Contents/Info.plist"
          codesign --force --deep --options runtime --timestamp \
            --sign "$APP_IDENTITY" "$app"
          codesign --verify --strict --verbose "$app"

      - name: Notarize app and make ZIP
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            dist/AIQuota.app "$RUNNER_TEMP/notarize.zip"
          bash scripts/notarize.sh "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple dist/AIQuota.app
          xcrun stapler validate dist/AIQuota.app
          spctl --assess --type execute --verbose dist/AIQuota.app
          ditto -c -k --sequesterRsrc --keepParent dist/AIQuota.app \
            "dist/AIQuota-$VERSION-arm64.zip"

      - name: Make notarized DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto dist/AIQuota.app "$staging/AIQuota.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "AIQuota" -srcfolder "$staging" \
            -ov -format UDZO "dist/AIQuota-$VERSION-arm64.dmg"
          codesign --sign "$APP_IDENTITY" --timestamp "dist/AIQuota-$VERSION-arm64.dmg"
          bash scripts/notarize.sh "dist/AIQuota-$VERSION-arm64.dmg"
          xcrun stapler staple "dist/AIQuota-$VERSION-arm64.dmg"
          xcrun stapler validate "dist/AIQuota-$VERSION-arm64.dmg"

      - name: Make PKG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="dist/AIQuota-$VERSION-arm64.pkg"
          staging="$RUNNER_TEMP/pkg-root"
          components="$RUNNER_TEMP/pkg-components.plist"
          mkdir -p "$staging"
          ditto dist/AIQuota.app "$staging/AIQuota.app"
          pkgbuild --analyze --root "$staging" "$components"
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" "$components"
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsVersionChecked false" "$components"
          pkgbuild --root "$staging" --component-plist "$components" \
            --identifier com.praveenjuge.ai-quota \
            --install-location /Applications \
            --version "$VERSION" "$pkg"
          if [ -n "$INSTALLER_IDENTITY" ]; then
            productsign --sign "$INSTALLER_IDENTITY" "$pkg" "$pkg.signed"
            mv "$pkg.signed" "$pkg"
            pkgutil --check-signature "$pkg"
            bash scripts/notarize.sh "$pkg"
            xcrun stapler staple "$pkg"
            xcrun stapler validate "$pkg"
            echo "PKG signed and notarized"
          else
            echo "::warning::PKG contains the notarized app but is unsigned; a Developer ID Installer certificate is required for Gatekeeper-approved installation."
          fi

      - name: Verify PKG installation and launch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sudo installer -pkg "dist/AIQuota-$VERSION-arm64.pkg" -target /
          installed="/Applications/AIQuota.app"
          cmp dist/AIQuota.app/Contents/MacOS/AIQuota "$installed/Contents/MacOS/AIQuota"
          installed_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$installed/Contents/Info.plist")
          [ "$installed_version" = "$VERSION" ]
          codesign --verify --strict --verbose "$installed"
          "$installed/Contents/MacOS/AIQuota" --dump-usage

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/app-cert.p12" "$RUNNER_TEMP/installer-cert.p12"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"
          notes="macOS 14 or later, Apple Silicon. ZIP and DMG contain the signed, notarized app."
          if [ -z "$INSTALLER_IDENTITY" ]; then
            notes="$notes The PKG is unsigned; use ZIP or DMG for Gatekeeper-approved installation."
          fi
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --notes "$notes" \
            "dist/AIQuota-$VERSION-arm64.zip" \
            "dist/AIQuota-$VERSION-arm64.dmg" \
            "dist/AIQuota-$VERSION-arm64.pkg"
